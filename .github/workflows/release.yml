name: Release

# Push a tag like `v2.1.0` and this workflow will:
#   1. Verify the tag matches the version in package.json
#   2. Publish the package to npm (with provenance)
#   3. Create a GitHub Release with the matching CHANGELOG section
#
# Prerequisites:
#   - Repository secret `NPM_TOKEN` set to an npm automation token
#     (npmjs.com → Access Tokens → Automation).
#   - `id-token: write` permission is enabled (configured below) so npm
#     can attach build provenance.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org/'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches tag
        id: version
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      - name: Build (sanity check)
        run: npm run build

      - name: Extract CHANGELOG entry for this version
        id: changelog
        run: |
          set -e
          # Section between this version header and the next.
          BODY=$(awk '/^## \[?[0-9]+\.[0-9]+\.[0-9]+/{count++; if(count==2) exit} count==1{print}' CHANGELOG.md)
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
